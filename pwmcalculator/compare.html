var mode = "con";
var ownRisk = false;
var hasBirthdayThisYear = true;
var ageInputMode = "year";
var CURRENT_YEAR = 2026;

var HDR_THEMES = {
  con: { bg:"linear-gradient(105deg,#C0001A 0%,#E8001D 60%,#F5263E 100%)", shadow:"rgba(200,0,20,.22)", activeColor:"#E8001D", tog:"tog-red" },
  sha: { bg:"linear-gradient(105deg,#2EA8A8 0%,#4BBFBF 60%,#5DCECE 100%)", shadow:"rgba(45,130,130,.22)", activeColor:"#2E9E9E", tog:"tog-teal" }
};

function setMode(m) {
  mode = m;
  document.body.classList.toggle("mode-sha", m === "sha");
  document.body.classList.toggle("mode-con", m === "con");
  var cfg = HDR_THEMES[m];
  var hdr = document.getElementById("mainHdr");
  hdr.style.background = cfg.bg;
  hdr.style.boxShadow  = "0 2px 16px " + cfg.shadow;
  document.getElementById("modeCon").classList.toggle("active", m === "con");
  document.getElementById("modeSha").classList.toggle("active", m === "sha");
  document.getElementById("modeCon").style.color = m === "con" ? cfg.activeColor : "rgba(255,255,255,0.7)";
  document.getElementById("modeSha").style.color = m === "sha" ? cfg.activeColor : "rgba(255,255,255,0.7)";
  var growthHubLogo = m === "con" ? L_GH_RED : L_GH_TEAL;
  document.getElementById("hdrLogo").src = growthHubLogo;
  document.querySelector(".footer-gh-logo img").src = growthHubLogo;
  document.getElementById("footerPruLogo").src = growthHubLogo;
  document.getElementById("hdrTitle").textContent = m === "con" ? "PRUWell Medical" : "PRUWell Medical Syariah";
  var backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.style.background = m === "con" ? "#E8001D" : "#2E9E9E";
  document.getElementById("hdrSub").textContent = "Data as per April 2026";
  document.getElementById("footerRole").textContent = "GrowthHub";
  applyToggleColors();
  render();
}

function applyToggleColors() {
  var cls = HDR_THEMES[mode].tog;
  ["noOR","yesOR","hbYes","hbNo"].forEach(function(id) {
    document.getElementById(id).classList.remove("tog-red","tog-teal");
  });
  if (!ownRisk) document.getElementById("noOR").classList.add(cls);
  else          document.getElementById("yesOR").classList.add(cls);
  if (hasBirthdayThisYear) document.getElementById("hbYes").classList.add(cls);
  else                     document.getElementById("hbNo").classList.add(cls);
}

function setOR(v) {
  ownRisk = v;
  applyToggleColors();
  render();
}

function setHB(v) {
  hasBirthdayThisYear = v;
  if (ageInputMode === "year") syncAgeFromYear();
  applyToggleColors();
  render();
}

function setAgeInputMode(active) {
  ageInputMode = active;
  var ageEl = document.getElementById("ageInput");
  var yearEl = document.getElementById("byear");
  var hbEl = document.getElementById("hbWrap");
  ageEl.classList.toggle("inp-active", active === "age");
  ageEl.classList.toggle("inp-inactive", active !== "age");
  yearEl.classList.toggle("inp-active", active === "year");
  yearEl.classList.toggle("inp-inactive", active !== "year");
  hbEl.classList.toggle("hb-active", active === "year");
  hbEl.classList.toggle("hb-inactive", active !== "year");
}

function syncAgeFromYear() {
  var by = parseInt(document.getElementById("byear").value) || 1993;
  var age = hasBirthdayThisYear ? (CURRENT_YEAR - by) : (CURRENT_YEAR - by - 1);
  document.getElementById("ageInput").value = Math.max(1, Math.min(74, age));
}

function onYearChange() {
  setAgeInputMode("year");
  syncAgeFromYear();
  render();
}

function onAgeChange() {
  var age = parseInt(document.getElementById("ageInput").value) || 33;
  age = Math.max(1, Math.min(74, age));
  document.getElementById("byear").value = CURRENT_YEAR - age;
  setAgeInputMode("age");
  render();
}

function getAge() {
  if (ageInputMode === "age") {
    return (parseInt(document.getElementById("ageInput").value) || 33) + 1;
  }
  var by = parseInt(document.getElementById("byear").value) || 1993;
  var actual = hasBirthdayThisYear ? (CURRENT_YEAR - by) : (CURRENT_YEAR - by - 1);
  return actual + 1;
}

function getPremium(pk, age, g) {
  var DATA = mode === "con" ? CONV : SYAR;
  var tbl  = ownRisk ? DATA[pk].withOR : DATA[pk].noOR;
  var idx  = Math.min(Math.max(age - 1, 0), 74);
  return tbl[g][idx];
}

function formatPremiBulanan(v) {
  var rupiah = v / 11 * 1000; // premi tahunan / 11 = premi bulanan
  if (rupiah < 1000000) {
    return Math.round(rupiah / 1000).toLocaleString("id-ID") + " rb";
  }
  return (rupiah / 1000000).toFixed(3) + " jt";
}

function pctColor(pct) {
  if (pct < 85)   return {bg:"#DCFCE7", fg:"#14532D"};
  if (pct < 100)  return {bg:"#BBF7D0", fg:"#15803D"};
  if (pct === 100)return {bg:"#EEF2FF", fg:"#3730A3"};
  if (pct < 150)  return {bg:"#FEE2E2", fg:"#991B1B"};
  if (pct < 200)  return {bg:"#FECACA", fg:"#7F1D1D"};
  return              {bg:"#FCA5A5", fg:"#7F1D1D"};
}

function render() {
  var g      = document.getElementById("gender").value;
  var basePk = document.getElementById("plan").value;
  var curAge = getAge();
  var info   = PLAN_INFO[basePk];
  var badgeCls  = mode === "con" ? "red" : "teal";
  var accentColor = mode === "con" ? "var(--red)" : "var(--teal-dk)";

  var basePremNow = getPremium(basePk, curAge, g);

  // INFO STRIP
  document.getElementById("infoStrip").innerHTML =
    '<div class="info-item"><div class="info-k">Plan Baseline</div><div class="info-v" style="font-size:13px">' + info.emoji + ' ' + info.label + ' <span style="font-size:9px;font-weight:700;color:var(--accent-deep)">(100%)</span></div></div>' +
    '<div class="info-sep"></div>' +
    '<div class="info-item"><div class="info-k">Jenis Kelamin</div><div class="info-v" style="font-size:13px">' + g + '</div></div>' +
    '<div class="info-sep"></div>' +
    '<div class="info-item"><div class="info-k">Usia Polis</div><div class="info-v" style="font-size:13px">' + curAge + ' tahun</div></div>' +
    '<div class="info-sep"></div>' +
    '<div class="info-item"><div class="info-k">Own Risk</div><div class="info-v" style="font-size:13px">' + (ownRisk ? info.or : "Tanpa") + '</div></div>' +
    '<div class="info-sep"></div>' +
    '<div class="info-item"><div class="info-k">Premi Baseline</div>' +
    '<div class="info-v" style="color:'+accentColor+';font-size:13px">Rp ' + formatPremiBulanan(basePremNow) + '/bln</div></div>';

  // BUILD TABLE
  var plans   = PLAN_ORDER;
  var baseIdx = plans.indexOf(basePk);

  // THEAD
  var thead = "<thead><tr>";
  thead += '<th class="age-hdr" style="width:36px;min-width:36px;font-size:10px">Usia</th>';
  plans.forEach(function(pk, i) {
    var inf    = PLAN_INFO[pk];
    var isBase = pk === basePk;
    var arrow  = i < baseIdx ? "&#8592;" : i > baseIdx ? "&#8594;" : "";
    var shortLabel = {bronzeA:"Br A",bronzeB:"Br B",silverA:"Sv A",silverB:"Sv B",gold:"Gold",platinum:"Plat",diamond:"Dia"}[pk];
    thead += '<th class="plan-hdr' + (isBase ? " base-hdr" : "") + '" style="min-width:0;width:auto">' +
      '<span class="plan-emoji">' + inf.emoji + '</span><div style="color:' + inf.color + ';font-size:10px;font-weight:800;white-space:nowrap">' +
      (arrow ? '<span class="plan-arrow" style="color:var(--text-3);font-size:9px">' + arrow + '</span> ' : "") +
      '<span class="plan-label-full">' + inf.label + '</span><span class="plan-label-short">' + shortLabel + '</span></div>' +
      '<div class="plan-cover" style="font-size:8px;color:var(--text-3);font-weight:500;margin-top:1px;white-space:nowrap">' + inf.cov.split(' · ')[0] + '</div>' +
      (isBase ? '<div class="base-pill">✓ PILIHAN</div>' : "") +
      '</th>';
  });
  thead += "</tr></thead>";

  // TBODY
  var tbody = "<tbody>";
  for (var a = curAge; a <= 75; a++) {
    var basePrem_a = getPremium(basePk, a, g);
    var isDecade   = (a % 10 === 0);
    tbody += '<tr' + (isDecade ? ' class="age-decade"' : '') + '>';
    tbody += '<td class="age-col"><strong>' + a + '</strong></td>';

    plans.forEach(function(pk) {
      var isBase  = pk === basePk;
      var prem_a  = getPremium(pk, a, g);
      var pct     = Math.round(prem_a / basePrem_a * 100);
      var premJt  = formatPremiBulanan(prem_a);

      if (isBase) {
        tbody += '<td class="base-col" style="padding:5px 4px">' +
          '<div style="font-size:11px;font-weight:800;color:var(--accent-deep)">✓ 100%</div>' +
          '<div style="font-size:9px;color:var(--text-3);margin-top:1px">' + premJt + '</div>' +
          '</td>';
      } else {
        var c = pctColor(pct);
        tbody += '<td class="pct-cell" style="background:' + c.bg + ';color:' + c.fg + ';padding:5px 4px">' +
          '<div style="font-size:11px;font-weight:800">' + pct + '%</div>' +
          '<div style="font-size:9px;opacity:.75;margin-top:1px">' + premJt + '</div>' +
          '</td>';
      }
    });
    tbody += '</tr>';
  }
  tbody += "</tbody>";

  document.getElementById("mainTable").innerHTML = thead + tbody;
}

function initLiquidSelect(selectId, iconMap) {
  var select = document.getElementById(selectId);
  if (!select || select.dataset.liquidReady) return;
  select.dataset.liquidReady = "1";
  select.classList.add("custom-select-native");

  var wrap = document.createElement("div");
  wrap.className = "liquid-select";
  wrap.dataset.for = selectId;
  var button = document.createElement("button");
  button.type = "button";
  button.className = "liquid-select-btn";
  button.setAttribute("aria-haspopup", "listbox");
  button.setAttribute("aria-expanded", "false");
  var menu = document.createElement("div");
  menu.className = "liquid-select-menu";
  menu.setAttribute("role", "listbox");
  wrap.appendChild(button);
  wrap.appendChild(menu);
  select.insertAdjacentElement("afterend", wrap);

  function iconFor(value) { return iconMap[value] || "✦"; }
  function refresh() {
    var chosen = select.options[select.selectedIndex];
    button.innerHTML = '<span class="liquid-select-icon">' + iconFor(chosen.value) + '</span><span class="liquid-select-label">' + chosen.text + '</span>';
    Array.prototype.forEach.call(menu.children, function(optionButton) {
      optionButton.classList.toggle("selected", optionButton.dataset.value === select.value);
      optionButton.setAttribute("aria-selected", optionButton.dataset.value === select.value ? "true" : "false");
    });
  }

  Array.prototype.forEach.call(select.options, function(option) {
    var item = document.createElement("button");
    item.type = "button";
    item.className = "liquid-select-option";
    item.dataset.value = option.value;
    item.setAttribute("role", "option");
    item.innerHTML = '<span class="opt-icon">' + iconFor(option.value) + '</span><span>' + option.text + '</span><span class="opt-check">✓</span>';
    item.addEventListener("click", function() {
      select.value = option.value;
      select.dispatchEvent(new Event("change", {bubbles:true}));
      refresh();
      wrap.classList.remove("open");
      button.setAttribute("aria-expanded", "false");
      button.focus();
    });
    menu.appendChild(item);
  });

  button.addEventListener("click", function(e) {
    e.stopPropagation();
    document.querySelectorAll(".liquid-select.open").forEach(function(other) { if (other !== wrap) other.classList.remove("open"); });
    var isOpen = wrap.classList.toggle("open");
    button.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });
  button.addEventListener("keydown", function(e) {
    if (e.key === "Escape") { wrap.classList.remove("open"); button.setAttribute("aria-expanded", "false"); }
  });
  select.addEventListener("change", refresh);
  refresh();
}

document.addEventListener("click", function() {
  document.querySelectorAll(".liquid-select.open").forEach(function(el) {
    el.classList.remove("open");
    el.querySelector(".liquid-select-btn").setAttribute("aria-expanded", "false");
  });
});

// EVENTS
document.getElementById("gender").addEventListener("change", render);
document.getElementById("plan").addEventListener("change", render);

// INIT
initLiquidSelect("gender", {Pria:"👨", Wanita:"👩"});
initLiquidSelect("plan", {
  bronzeA:"🥉", bronzeB:"🛏️", silverA:"🥈", silverB:"💠",
  gold:"🏆", platinum:"👑", diamond:"💎"
});
setMode("con");
</script>

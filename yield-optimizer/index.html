<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Strike Currency Yield Optimizer — CIMB Niaga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#790008;--red2:#ed3024;--red-l:#FEF2F2;
  --navy:#0F172A;--sl:#334155;--slate:#64748B;
  --border:#E2E8F0;--bg:#F8FAFC;
  --green:#065F46;--green-l:#ECFDF5;
  --amber:#B45309;--amber-l:#FFFBEB;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
body{
  min-height:100vh;
  background:
    radial-gradient(520px circle at 8% 6%,rgba(216,20,40,.38),transparent 60%),
    radial-gradient(460px circle at 96% 18%,rgba(120,0,10,.32),transparent 55%),
    radial-gradient(560px circle at 15% 88%,rgba(70,0,10,.3),transparent 60%),
    radial-gradient(420px circle at 92% 92%,rgba(190,20,40,.24),transparent 55%),
    linear-gradient(180deg,#efe9e6,#e3dbd7);
  background-attachment:fixed;
  font-family:var(--sans);color:var(--navy);
}
.app{max-width:480px;margin:0 auto;padding-bottom:40px}

/* ── HEADER ── */
.hdr{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(125,6,16,.82) 0%,rgba(90,0,7,.85) 45%,rgba(50,0,4,.88) 100%);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.22);border-top:none;
  border-radius:0 0 24px 24px;padding:0;margin-bottom:18px;
  box-shadow:0 14px 32px -10px rgba(80,0,7,.5),inset 0 1px 0 rgba(255,255,255,.22);
}
.hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:55%;
  background:linear-gradient(to bottom,rgba(255,255,255,.2),transparent);pointer-events:none}
.hdr-main{position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:24px 18px 22px}
.hdr-logo{height:30px;width:auto;flex-shrink:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.hdr-divider{width:1px;align-self:stretch;flex-shrink:0;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.4) 20%,rgba(255,255,255,.4) 80%,transparent)}
.hdr-title{flex:1;min-width:0}
.hdr-title h1{font-size:16.5px;font-weight:700;color:#fff;line-height:1.28;letter-spacing:-.01em}

/* ── CARD ── */
.card{
  position:relative;overflow:hidden;
  background:rgba(255,255,255,.58);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.65);border-radius:20px;
  box-shadow:0 8px 26px rgba(80,0,10,.12),inset 0 1px 0 rgba(255,255,255,.5);
  margin:0 12px 12px}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:44%;
  background:linear-gradient(to bottom,rgba(255,255,255,.4),transparent);
  pointer-events:none;border-radius:20px 20px 0 0}
.card-head{position:relative;z-index:1;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.5);display:flex;align-items:center;gap:8px;border-radius:20px 20px 0 0}
.card-head-title{font-size:12px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.06em}
.card-body{position:relative;z-index:1;padding:14px 16px}

/* ── CCY DROPDOWN ── */
.ccy-dropdown{position:relative;user-select:none;width:100%}
.ccy-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;border:1.5px solid rgba(255,255,255,.8);border-radius:10px;padding:9px 12px;
  background:rgba(255,255,255,.55);cursor:pointer;font-family:var(--mono);font-weight:700;font-size:13px;
  color:var(--navy);transition:border-color .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.ccy-btn:hover,.ccy-btn.open{border-color:var(--red)}
.ccy-btn.open{border-bottom-left-radius:0;border-bottom-right-radius:0}
.ccy-arrow{font-size:9px;color:var(--slate);transition:transform .15s}
.ccy-btn.open .ccy-arrow{transform:rotate(180deg)}
.ccy-menu{display:none;position:absolute;top:100%;left:0;right:0;
  background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  border:1.5px solid var(--red);border-top:none;border-bottom-left-radius:12px;
  border-bottom-right-radius:12px;z-index:999;box-shadow:0 10px 28px rgba(121,0,8,.18);
  max-height:280px;overflow-y:auto}
.ccy-menu.show{display:block}
.ccy-item{display:flex;align-items:center;gap:8px;padding:9px 12px;
  font-family:var(--mono);font-weight:600;font-size:13px;cursor:pointer;
  color:var(--navy);transition:background .1s}
.ccy-item:hover{background:var(--red-l);color:var(--red)}
.ccy-item.active{background:var(--red);color:#fff}.ccy-item.active .ccy-check{color:#fff}
.ccy-check{font-size:10px;width:14px;text-align:center;flex-shrink:0;margin-left:auto}
.ccy-flag{font-size:16px;flex-shrink:0}
.ccy-divider{height:1px;background:rgba(0,0,0,.06);margin:0 12px}

/* ── NOTIONAL INPUT ── */
.field-lbl{font-size:11px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.field-row{display:flex;align-items:center;border:1.5px solid rgba(255,255,255,.8);border-radius:10px;overflow:hidden;
  background:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.field-pre{padding:0 11px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--slate);background:rgba(255,255,255,.35);border-right:1px solid rgba(255,255,255,.7);white-space:nowrap;height:40px;display:flex;align-items:center}
.field-row input{flex:1;border:none;padding:9px 11px;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--navy);outline:none;background:transparent}
.field-row:focus-within{border-color:var(--red)}
.field-hint{font-size:10px;color:var(--slate);margin-top:4px}

/* ── TENOR TABS ── */
.tenor-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tenor-btn{padding:7px 14px;border-radius:8px;font-family:var(--mono);font-weight:600;font-size:12px;
  border:1.5px solid rgba(255,255,255,.8);background:rgba(255,255,255,.5);cursor:pointer;color:var(--slate);transition:all .15s}
.tenor-btn:hover{border-color:var(--red);color:var(--red)}
.tenor-btn.active{background:linear-gradient(135deg,rgba(180,10,20,.92),rgba(100,0,8,.94));
  color:#fff;border-color:rgba(255,255,255,.3);box-shadow:0 2px 10px rgba(121,0,8,.35),inset 0 1px 0 rgba(255,255,255,.25)}

/* ── CALC BUTTON ── */
.calc-btn{width:100%;padding:12px;color:#fff;border:none;border-radius:10px;
  background:linear-gradient(135deg,rgba(185,12,22,.94),rgba(90,0,6,.96));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.25);
  font-family:var(--sans);font-weight:700;font-size:14px;cursor:pointer;
  box-shadow:0 6px 18px rgba(121,0,8,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:all .15s;margin-top:4px}
.calc-btn:hover{box-shadow:0 8px 22px rgba(121,0,8,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.calc-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── RESULTS ── */
.results-wrap{overflow-x:auto;margin:0 -16px}
.opt-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;min-width:360px}
.opt-table th{padding:7px 8px;background:var(--bg);color:var(--slate);font-weight:700;font-size:10px;text-align:center;border-bottom:2px solid var(--border);position:sticky;top:0}
.opt-table th:first-child{text-align:left;padding-left:12px}
.opt-table td{padding:8px 8px;border-bottom:1px solid #F1F5F9;text-align:center;color:var(--navy);font-weight:600;transition:background .1s}
.opt-table td:first-child{text-align:left;padding-left:12px;font-size:12px;white-space:nowrap}
.opt-table tr:hover td{background:#FAFAFA}
.opt-table td.best{background:var(--green-l);color:var(--green);font-weight:700;border-radius:4px}
.opt-table td.second{background:#ECFEFF;color:#0E7490;font-weight:700}
.opt-table td.no-vol{color:#CBD5E1;font-style:italic}
.opt-table .pair-badge{font-size:10px;font-weight:700;letter-spacing:.02em}
.opt-table .mode-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff;margin-left:4px;vertical-align:middle}
.mode-PUT{background:var(--red)}
.mode-CALL{background:#1D4ED8}

/* ── ADJ NOTICE ── */
.adj-notice{display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:rgba(255,251,235,.65);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(253,230,138,.7);border-radius:10px;font-size:11px;color:var(--amber);margin-bottom:12px}

/* ── BEST BANNER ── */
.best-banner{background:linear-gradient(135deg,rgba(236,253,245,.75),rgba(209,250,229,.75));
  -webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);
  border:1.5px solid rgba(110,231,183,.75);
  border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.best-banner .label{font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.best-banner .value{font-size:16px;font-weight:700;color:var(--green);font-family:var(--mono)}
.best-banner .sub{font-size:11px;color:#059669;margin-top:3px}

/* ── EMPTY ── */
.empty{text-align:center;padding:32px 16px;color:var(--slate);font-size:13px}
.empty .icon{font-size:32px;margin-bottom:8px}

/* ── FOOTER ── */
.footer{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:linear-gradient(135deg,rgba(150,4,16,.78),rgba(80,0,6,.82));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.28);border-radius:22px;
  box-shadow:0 10px 30px -6px rgba(121,0,8,.4),inset 0 1px 0 rgba(255,255,255,.3);
  padding:16px 18px;margin:0 12px 16px}
.footer::before{content:'';position:absolute;top:0;left:0;right:0;height:55%;
  background:linear-gradient(to bottom,rgba(255,255,255,.22),rgba(255,255,255,0));
  pointer-events:none}
.footer::after{content:'';position:absolute;top:-40%;left:-10%;width:70%;height:120%;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);
  pointer-events:none}
.footer-left{position:relative;z-index:1;display:flex;flex-direction:column;gap:7px}
.footer-brand-line{font-size:11.5px;font-weight:700;color:#fff;
  letter-spacing:.01em;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.footer-updated{font-size:10.5px;color:rgba(255,255,255,.8);font-family:var(--mono);white-space:nowrap}
.footer-cta{position:relative;z-index:1;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--red);
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.7);border-radius:12px;
  padding:8px 14px;white-space:nowrap;transition:all .15s;
  box-shadow:0 3px 10px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.9)}
.footer-cta:hover{background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.9)}
.footer-cta .arrow{font-size:12px;transition:transform .15s}
.footer-cta:hover .arrow{transform:translateX(2px)}
</style>
</head>

// ─── CORE MATH ────────────────────────────────────────────────────────────
function interp(days,table){
  if(days<=table[0].d) return table[0].r;
  if(days>=table[table.length-1].d) return table[table.length-1].r;
  for(let i=0;i<table.length-1;i++){
    if(days>=table[i].d&&days<=table[i+1].d){
      const t=(days-table[i].d)/(table[i+1].d-table[i].d);
      return table[i].r+t*(table[i+1].r-table[i].r);
    }
  }
  return table[table.length-1].r;
}

function getPairInfo(dep,alt){
  const isDepBase=RANK[dep]<RANK[alt];
  const base=isDepBase?dep:alt, quote=isDepBase?alt:dep;
  const isJPY=base==='JPY'||quote==='JPY';
  const isIDR=(base==='IDR'||quote==='IDR')&&!isJPY;
  const dec=isIDR?0:isJPY?2:4;
  const pip=isIDR?1:isJPY?0.01:0.0001;
  const name=base+'/'+quote;
  const spot=PAIR_SPOTS[name]||PAIR_SPOTS_FALLBACK[name]||null;
  const mode=isDepBase?'CALL':'PUT';
  return {base,quote,name,mode,pip,dec,spot};
}

function norm(x){return x/100/360;}

function gkCALL(S,K,rd,rf,sigma,T){
  if(sigma<=0||T<=0) return 0;
  const d1=(Math.log(S/K)+(rd-rf+sigma*sigma/2)*T)/(sigma*Math.sqrt(T));
  const d2=d1-sigma*Math.sqrt(T);
  return S*Math.exp(-rf*T)*Ncdf(d1)-K*Math.exp(-rd*T)*Ncdf(d2);
}

function gkPUT(S,K,rd,rf,sigma,T){
  if(sigma<=0||T<=0) return 0;
  const d1=(Math.log(S/K)+(rd-rf+sigma*sigma/2)*T)/(sigma*Math.sqrt(T));
  const d2=d1-sigma*Math.sqrt(T);
  return K*Math.exp(-rd*T)*Ncdf(-d2)-S*Math.exp(-rf*T)*Ncdf(-d1);
}

function Ncdf(x){
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const sign=x<0?-1:1;x=Math.abs(x);
  const t=1/(1+p*x);
  const y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return 0.5*(1+sign*y);
}

function calcYield(dep, alt, tenor, strikeOffsetPips, notionalRaw, volDelta){
  const pi = getPairInfo(dep, alt);
  if(!pi.spot) return null;
  const vol = liveVols[pi.name];
  if(!vol) return null;

  const adjVol = vol + (volDelta||0);
  const sigma  = adjVol / 100;
  const T      = tenor / 365;
  const depRate= interp(tenor, CCY_DEP[dep]) / 100;
  const rdRate = interp(tenor, CCY_OPT[pi.quote]) / 100;
  const rfRate = interp(tenor, CCY_OPT[pi.base])  / 100;

  const K = pi.spot + strikeOffsetPips * pi.pip;
  if(K <= 0) return null;

  const optPrice = pi.mode==='PUT'
    ? gkPUT(pi.spot, K, rdRate, rfRate, sigma, T)
    : gkCALL(pi.spot, K, rdRate, rfRate, sigma, T);

  // Premium in deposit CCY
  const prem = pi.mode==='PUT'
    ? optPrice * (1 / pi.spot)   // PUT: price in quote/base, deposit=quote → per unit base
    : optPrice / pi.spot;        // CALL: price in quote, divide by spot → deposit CCY

  const depInc  = depRate * T;
  const premInc = prem;
  const total   = depInc + premInc;
  const yieldPA = (total / T) * 100;
  return Math.max(0, yieldPA);
}

// ─── OPTIMIZER ────────────────────────────────────────────────────────────
function runOptimizer(){
  const card=document.getElementById('resultsCard');
  const body=document.getElementById('resultsBody');
  const title=document.getElementById('resultsTitle');
  card.style.display='';
  body.innerHTML='<div class="empty"><div class="icon">⏳</div>Menghitung...</div>';

  // Which pairs are available from depositCCY?
  const pairs=HIERARCHY.filter(alt=>alt!==depositCCY).map(alt=>getPairInfo(depositCCY,alt));
  const tenor=activeTenor;

  // Check adjustments — tenor and notional each have their own vol add.
  // If only one condition is met, use that rule's amount. If both are met,
  // use whichever amount is larger (never both added together).
  const notUSD=getNotUSD();
  const tenorAdj=tenor>=adjRules.tenorDays;
  const notAdj=notUSD!==null&&notUSD>=adjRules.notionalUSD;
  const useAdj=tenorAdj||notAdj;
  let volDelta=0;
  if(tenorAdj&&notAdj) volDelta=Math.max(adjRules.tenorVolAdd,adjRules.notionalVolAdd);
  else if(tenorAdj)    volDelta=adjRules.tenorVolAdd;
  else if(notAdj)      volDelta=adjRules.notionalVolAdd;

  title.textContent=`Hasil — ${depositCCY} · ${tenor}d`;

  // Build results matrix
  let rows=[];
  let globalBest={yield:-99,pair:'',strike:0,strikeLbl:''};

  pairs.forEach(pi=>{
    const vol=liveVols[pi.name];
    const rowYields=STRIKES.map((pips,si)=>{
      if(!vol) return null;
      const y=calcYield(depositCCY,pi.name.replace(depositCCY,'').replace('/','').replace('/',''),tenor,pips,null,volDelta);
      return y;
    });
    // Actually recalculate with alt
    const alt=pi.base===depositCCY?pi.quote:pi.base;
    const rowY=STRIKES.map(pips=>{
      if(!vol) return null;
      return calcYield(depositCCY,alt,tenor,pips,null,volDelta);
    });
    const maxY=Math.max(...rowY.filter(v=>v!==null));
    const maxIdx=rowY.findIndex(v=>v===maxY);
    if(maxY>globalBest.yield&&maxIdx>=0){
      globalBest={yield:maxY,pair:pi.name,mode:pi.mode,strike:STRIKES[maxIdx],strikeLbl:STRIKE_LABELS[maxIdx],vol:vol+volDelta};
    }
    rows.push({pi,alt,yields:rowY,maxY,maxIdx,vol});
  });

  // Sort by maxY descending
  rows.sort((a,b)=>b.maxY-a.maxY);

  // Render
  let html='';

  // Adj notice
  if(useAdj){
    let reasons=[];
    if(tenorAdj) reasons.push(`tenor ${tenor}d ≥ ${adjRules.tenorDays}d (+${adjRules.tenorVolAdd}%)`);
    if(notAdj) reasons.push(`notional ≥ ${adjRules.notionalUSD.toLocaleString()} USD (+${adjRules.notionalVolAdd}%)`);
    let noticeText = `⚡ Vol +${volDelta}% — ${reasons.join(' & ')}`;
    if(tenorAdj && notAdj) noticeText += ' · dipakai yang terbesar, tidak dijumlah';
    html+=`<div class="adj-notice">${noticeText}</div>`;
  }

  // Best banner
  if(globalBest.yield>0){
    html+=`<div class="best-banner">
      <div class="label">🏆 Terbaik</div>
      <div class="value">${globalBest.yield.toFixed(2)}% p.a.</div>
      <div class="sub">${globalBest.pair} · Strike ${globalBest.strikeLbl} pips · Vol ${globalBest.vol.toFixed(2)}%</div>
    </div>`;
  }

  // Table
  html+=`<div class="results-wrap"><table class="opt-table">
    <thead><tr>
      <th>Pair</th>
      ${STRIKE_LABELS.map(l=>`<th>${l}</th>`).join('')}
    </tr></thead><tbody>`;

  rows.forEach(({pi,yields,maxY,maxIdx,vol})=>{
    const hasVol=vol!=null;
    html+=`<tr>
      <td>
        <span class="pair-badge">${pi.name}</span>
        <span class="mode-badge mode-${pi.mode}">${pi.mode}</span>
        ${hasVol?`<br><span style="font-size:9px;color:var(--slate)">vol ${(vol+volDelta).toFixed(2)}%</span>`:''}
      </td>
      ${yields.map((y,i)=>{
        if(!hasVol) return `<td class="no-vol" colspan="1">—</td>`;
        if(y===null) return `<td class="no-vol">—</td>`;
        const isBest=i===maxIdx&&y===maxY;
        const isSecond=y===maxY&&!isBest;
        return `<td class="${isBest?'best':''}">${y.toFixed(2)}</td>`;
      }).join('')}
    </tr>`;
  });

  html+='</tbody></table></div>';

  html+=`<div style="font-size:10px;color:var(--slate);margin-top:10px;font-family:var(--mono)">
    Yield % p.a.
  </div>`;

  body.innerHTML=html;
}

    if(toArr(opt.JPY))JPY_OPT=toArr(opt.JPY);
    CCY_DEP={EUR:EUR_DEP,GBP:GBP_DEP,AUD:AUD_DEP,NZD:NZD_DEP,USD:USD_DEP,SGD:SGD_DEP,JPY:JPY_DEP,IDR:IDR_DEP};
    CCY_OPT={EUR:EUR_OPT,GBP:GBP_OPT,AUD:AUD_OPT,NZD:NZD_OPT,USD:USD_OPT,SGD:SGD_OPT,JPY:JPY_OPT,IDR:IDR_OPT};

    if(data.volatility) liveVols={...data.volatility};
    if(data.spot_rates) PAIR_SPOTS={...data.spot_rates};
    if(Array.isArray(data.holidays)) liveHolidays=data.holidays;
    if(data.vol_adjustments){
      const a=data.vol_adjustments;
      if(a.tenorDays)   adjRules.tenorDays=a.tenorDays;
      if(a.notionalUSD) adjRules.notionalUSD=a.notionalUSD;
      // Separate vol-add per rule. Falls back to the old shared "volAdd"
      // field for rows saved before tenor/notional were split apart.
      if(a.tenorVolAdd!=null)    adjRules.tenorVolAdd=a.tenorVolAdd;
      else if(a.volAdd!=null)    adjRules.tenorVolAdd=a.volAdd;
      if(a.notionalVolAdd!=null) adjRules.notionalVolAdd=a.notionalVolAdd;
      else if(a.volAdd!=null)    adjRules.notionalVolAdd=a.volAdd;
    }

    if(data.updated_at){
      const d=new Date(data.updated_at);
      document.getElementById('ratesTs').textContent=
        d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' '+
        d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' WIB';
    }
  }catch(e){console.warn('Supabase error:',e);}
})();

// ─── INIT ─────────────────────────────────────────────────────────────────
buildDepMenu();
setTenor(30);
</script>

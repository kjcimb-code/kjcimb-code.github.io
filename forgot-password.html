  .bg-overlay{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg, rgba(8,3,3,.55) 0%, rgba(8,3,3,.85) 60%, rgba(8,3,3,.94) 100%);}

  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 20px;
  }

  .footer{margin-top:18px;text-align:center;font-size:10px;font-family:var(--mono);color:rgba(255,255,255,.2);}

  .card{
    width:100%;
    max-width:360px;
    background:var(--ink);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.2);
    animation:riseIn .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ---------- Header ---------- */
  .card-header{
    background:linear-gradient(120deg, var(--maroon-1), var(--maroon-2));
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid rgba(255,255,255,.14);
  }
  .card-header .logo{
    height:16px;
    width:auto;
    flex-shrink:0;
  }
  .hdr-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .hdr-div{
    font-size:11px;
    font-weight:600;
    color:rgba(255,255,255,.92);
    white-space:nowrap;
    letter-spacing:.01em;
  }
  .octo{
    width:24px;
    height:24px;
    border-radius:6px;
    overflow:hidden;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .octo img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ---------- Body ---------- */
  .card-body{
    padding:34px 28px 32px;
  }
  h1{
    font-family:var(--display);
    font-size:28px;
    font-weight:600;
    letter-spacing:-.01em;
    margin-bottom:5px;
    color:var(--text-0);
  }
  .sub{
    color:var(--text-1);
    font-size:13px;
    line-height:1.5;
    margin-bottom:32px;
  }

  label{
    display:block;
    font-size:11.5px;
    color:var(--text-1);
    margin-bottom:9px;
    font-weight:600;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .field{margin-bottom:22px;}
  input{
    width:100%;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--text-0);
    font-size:14.5px;
    padding:14px;
    border-radius:10px;
    font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{color:#9CA3AF;}
  input:focus{
    outline:none;
    border-color:var(--maroon-1);
    box-shadow:0 0 0 3px rgba(138,0,9,.25);
  }

  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:44px;}
  .pw-toggle{
    position:absolute;top:0;right:0;height:100%;width:42px;
    background:none;border:none;margin:0;padding:0;
    color:var(--text-2);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:color .15s ease;
  }
  .pw-toggle:hover{color:var(--text-1);}

  button[type="submit"]{
    width:100%;
    margin-top:6px;
    padding:15px 14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(120deg, var(--maroon-1), var(--maroon-btn));
    color:#fff;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    letter-spacing:.01em;
    transition:filter .15s ease, transform .05s ease;
    box-shadow:0 8px 20px rgba(138,0,9,.35);
  }
  button[type="submit"]:hover{filter:brightness(1.1);}
  button[type="submit"]:active{transform:translateY(1px);}
  button[type="submit"]:disabled{opacity:.55;cursor:not-allowed;filter:none;}

  .error{
    display:none;
    margin-top:14px;
    padding:10px 12px;
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.35);
    color:#FCA5A5;
    font-size:13px;
    border-radius:8px;
  }

  .icon-circle{
    width:52px;height:52px;border-radius:50%;
    background:rgba(138,0,9,.18);
    border:1px solid rgba(138,0,9,.35);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    margin-bottom:18px;
  }
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--text-1);text-decoration:none;
    margin-top:22px;font-weight:500;
  }
  .back-link:hover{color:var(--text-0);}
  .contact-card{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-top:6px;
  }
  .contact-row{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-0);}
  .contact-row + .contact-row{margin-top:10px;}
  .contact-row .lbl{color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.03em;min-width:52px;}
</style>
</head>

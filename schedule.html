  .bg-overlay{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg, rgba(8,3,3,.62) 0%, rgba(8,3,3,.9) 40%, rgba(8,3,3,.97) 100%);pointer-events:none;}

  .app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:32px;}

  /* ---------- Top header ---------- */
  .topbar{
    background:linear-gradient(120deg, var(--maroon-1), var(--maroon-2));
    padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-bottom:1px solid rgba(255,255,255,.14);
    box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .topbar .logo{height:15px;width:auto;flex-shrink:0;max-width:35%;}
  .hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .hdr-div{font-family:var(--mono);font-size:10.5px;font-weight:500;color:rgba(255,255,255,.92);white-space:nowrap;}
  .octo{width:22px;height:22px;border-radius:6px;overflow:hidden;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .octo img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ---------- Welcome ---------- */
  .welcome-row{padding:22px 20px 16px;display:flex;align-items:center;gap:14px;}
  .avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#0D0606;flex-shrink:0;border:2px solid rgba(255,255,255,.12);}
  .welcome-name{font-family:var(--display);font-size:23px;font-weight:600;color:var(--text-0);letter-spacing:-.01em;line-height:1.15;}
  .welcome-role{font-family:var(--mono);font-size:11px;color:var(--text-2);margin-top:3px;letter-spacing:.02em;}

  /* ---------- Request button ---------- */
  .request-section{padding:0 20px 20px;}
  .request-btn{
    width:100%;
    background:linear-gradient(120deg, var(--maroon-1), var(--maroon-btn));
    border:none;color:#fff;
    font-family:var(--sans);
    font-size:14.5px;font-weight:600;
    padding:14px 16px;border-radius:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 10px 26px rgba(138,0,9,.32);
    transition:filter .15s ease, transform .05s ease;
  }
  .request-btn:hover{filter:brightness(1.08);}
  .request-btn:active{transform:translateY(1px);}

  /* ---------- Section header + toggle ---------- */
  .section-header{
    padding:4px 20px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex-wrap:wrap;
  }
  .section-title{font-family:var(--display);font-size:20px;font-weight:600;color:var(--text-0);}
  .view-toggle{display:flex;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;}
  .view-toggle button{
    border:none;background:none;color:var(--text-1);
    font-family:var(--sans);font-size:12px;font-weight:600;
    padding:7px 14px;border-radius:7px;cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  .view-toggle button.active{background:var(--maroon-btn);color:#fff;}

  /* ---------- Nav row ---------- */
  .nav-row{padding:0 20px 14px;display:flex;align-items:center;justify-content:space-between;}
  .nav-row button{
    background:var(--ink-2);border:1px solid var(--line);color:var(--text-0);
    width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-row button:hover{border-color:var(--maroon-1);}
  .nav-label{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--text-1);letter-spacing:.02em;}

  /* ---------- Legend ---------- */
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:0 20px 16px;}
  .legend .item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-1);font-family:var(--mono);}
  .legend .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

  /* ================= WEEKLY VIEW ================= */
  .week-list{padding:0 20px;display:flex;flex-direction:column;gap:12px;}
  .week-day{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .week-day:hover{border-color:rgba(255,255,255,.22);}
  .week-day.today{border-color:rgba(138,0,9,.55);}
  .week-day-header{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .week-day.today .week-day-header{background:linear-gradient(120deg, rgba(138,0,9,.2), rgba(138,0,9,.05));}
  .week-date-badge{
    flex-shrink:0;width:46px;height:46px;border-radius:12px;
    background:var(--ink-3);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
  }
  .week-day.today .week-date-badge{background:linear-gradient(135deg, var(--maroon-1), var(--maroon-btn));border-color:transparent;}
  .week-date-badge .badge-dow{font-family:var(--mono);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);}
  .week-day.today .week-date-badge .badge-dow{color:rgba(255,255,255,.82);}
  .week-date-badge .badge-num{font-family:var(--sans);font-size:18px;font-weight:600;color:var(--text-0);}
  .week-day-header .dow{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--text-0);}
  .week-day-header .datestr{font-family:var(--mono);font-size:11px;color:var(--text-2);margin-top:2px;}

  .week-slots{display:grid;grid-template-columns:1fr 1fr;}
  .week-slot{padding:12px 14px;min-height:58px;}
  .week-slot + .week-slot{border-left:1px solid var(--line);}
  .week-slot-label{font-family:var(--mono);font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin-bottom:8px;}
  .week-slot-empty{font-size:12px;color:var(--text-2);opacity:.55;}
  .week-names{display:flex;flex-direction:column;gap:5px;}
  .week-name-pill{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.05);}
  .week-name-pill .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .week-name-pill .extra{color:var(--text-2);font-weight:400;}

  .week-extra-row{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 14px;border-top:1px solid var(--line);}
  .week-extra-pill{display:flex;align-items:center;gap:5px;font-size:11px;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.045);}
  .week-extra-pill .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .week-extra-pill .tag{font-weight:600;color:var(--text-1);}

  /* ================= MONTHLY VIEW ================= */
  .calendar{margin:0 20px;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);}
  .weekdays div{padding:9px 2px;font-family:var(--mono);font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;text-align:center;font-weight:500;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .day{min-height:56px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 3px;position:relative;cursor:pointer;transition:background .12s ease;}
  .day:hover{background:rgba(255,255,255,.03);}
  .day:nth-child(7n){border-right:none;}
  .day.other{opacity:.22;cursor:default;}
  .day.other:hover{background:none;}
  .day.today .num{background:var(--maroon-btn);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-weight:600;}
  .num{font-size:11.5px;color:var(--text-1);}
  .dots-row{margin-top:5px;display:flex;flex-wrap:wrap;gap:2px;}
  .mini-dot{width:5px;height:5px;border-radius:50%;}

  /* ---------- Bottom actions ---------- */
  .bottom-actions{display:flex;flex-direction:column;gap:8px;padding:26px 20px 6px;}
  .icon-btn{
    background:var(--ink-2);border:1px solid var(--line);color:var(--text-1);
    height:40px;padding:0 14px;border-radius:11px;cursor:pointer;
    font-family:var(--sans);font-size:12.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;width:100%;
    transition:border-color .15s ease, color .15s ease;
  }
  .icon-btn:hover{border-color:var(--maroon-1);color:var(--text-0);}
  .logout-btn:hover{border-color:#EF4444;color:#FCA5A5;}
  .bottom-row{display:flex;gap:8px;}
  .bottom-row .icon-btn{flex:1;}

  .footer{margin-top:20px;text-align:center;font-size:10px;font-family:var(--mono);color:rgba(255,255,255,.2);}

  /* ---------- Modals ---------- */
  .overlay{display:none;position:fixed;inset:0;background:rgba(6,3,3,.65);backdrop-filter:blur(3px);align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.centered{align-items:center;padding:20px;}
  .modal{width:100%;max-width:460px;background:var(--ink);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:22px 20px 28px;max-height:88vh;overflow-y:auto;position:relative;}
  .overlay.centered .modal{border-radius:16px;max-width:380px;}
  .modal h2{font-family:var(--display);font-size:19px;font-weight:600;margin-bottom:4px;}
  .modal .modal-sub{font-size:12px;color:var(--text-2);margin-bottom:16px;}
  .modal label{display:block;font-family:var(--mono);font-size:10.5px;color:var(--text-1);margin-bottom:7px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;}
  .modal .field{margin-bottom:14px;}
  .modal select, .modal input, .modal textarea{
    width:100%;background:var(--ink-2);border:1px solid var(--line);color:var(--text-0);
    font-family:var(--sans);font-size:14px;padding:11px 12px;border-radius:10px;
  }
  .modal textarea{resize:vertical;min-height:60px;}
  .type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .type-grid button{background:var(--ink-2);border:1px solid var(--line);color:var(--text-1);padding:10px 4px;border-radius:10px;font-family:var(--sans);font-size:11.5px;font-weight:600;cursor:pointer;}
  .type-grid button.active{background:var(--maroon-btn);border-color:var(--maroon-btn);color:#fff;}
  .type-grid button:disabled{cursor:not-allowed;opacity:.4;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .modal-actions button{flex:1;padding:12px;border-radius:10px;border:none;font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn-save{background:linear-gradient(120deg, var(--maroon-1), var(--maroon-btn));color:#fff;}
  .btn-cancel{background:none;border:1px solid var(--line) !important;color:var(--text-1);}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-2);font-size:18px;cursor:pointer;}
  .existing-list{margin-top:2px;display:flex;flex-direction:column;gap:6px;}

<!-- Request / Add-entry modal -->
<div class="overlay" id="overlay">

    <div class="modal-sub" id="modalSub"></div>

    <div class="existing-list" id="existingList"></div>

    <form id="entryForm" style="margin-top:14px;">
      <div class="field" id="userField">
        <label for="entryUser">Untuk</label>
        <select id="entryUser"></select>
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;">
          <input type="checkbox" id="blockAllToggle" style="width:16px;height:16px;accent-color:var(--maroon-btn);">
          🔒 Block untuk semua tim (meeting, dll)
        </label>
      </div>
      <div class="field">
        <label>Jenis</label>
        <div class="type-grid" id="slotTypeGrid">
          <button type="button" data-slot="pagi" class="active">Pagi</button>
          <button type="button" data-slot="siang">Siang</button>
          <button type="button" data-slot="cuti">Cuti</button>
          <button type="button" data-slot="izin">Izin</button>
        </div>
        <input type="hidden" id="entrySlot" value="pagi">
      </div>
      <div class="field">
        <label for="entryDate">Tanggal</label>
        <input type="date" id="entryDate" required>
      </div>
      <div class="field">
        <label for="entryType">Keterangan singkat (opsional)</label>
        <input type="text" id="entryType" placeholder="cth. WFH, sakit, client visit">
      </div>
      <div class="field">
        <label for="entryDesc">Catatan (opsional)</label>
        <textarea id="entryDesc" placeholder="Detail tambahan..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelBtn">Batal</button>
        <button type="submit" class="btn-save">Simpan</button>
      </div>
    </form>
  </div>
</div>

  async function loadUsers(){
    try {

      if (error) { console.error('loadUsers error:', error); return; }
      allUsers = data || [];
      legend.innerHTML = allUsers.map(u => `
        <div class="item"><span class="dot" style="background:${u.color}"></span>${u.display_name}</div>
      `).join('');
      entryUserSel.innerHTML = allUsers.map(u => `<option value="${u.username}">${u.display_name}</option>`).join('');

      if (resetUserSel) {

    } catch (err) {
      console.error('loadUsers exception:', err);
    }
  }

  function userMeta(username){
    return allUsers.find(u => u.username === username) || { display_name: username, color:'#5C6B85', initial:'?' };

  async function loadEntriesRange(startStr, endStr){
    entriesByDate = {};
    try {
      const { data, error } = await sbClient
        .from('schedules')
        .select('id, username, date, slot, type, description')
        .gte('date', startStr)
        .lte('date', endStr);
      if (error) { console.error('loadEntriesRange error:', error); return; }
      (data || []).forEach(e => {
        if (!entriesByDate[e.date]) entriesByDate[e.date] = [];
        entriesByDate[e.date].push(e);
      });
    } catch (err) {
      console.error('loadEntriesRange exception:', err);
    }
  }

      const extraEntries = dayEntries.filter(e => e.slot === 'cuti' || e.slot === 'izin');

      const pagiHtml = pagiEntries.length
        ? `<div class="week-names">${pagiEntries.map(nameChip).join('')}</div>`
        : `<div class="week-slot-empty">—</div>`;
      const siangHtml = siangEntries.length
        ? `<div class="week-names">${siangEntries.map(nameChip).join('')}</div>`
        : `<div class="week-slot-empty">—</div>`;

      const extraHtml = extraEntries.length
        ? `<div class="week-extra-row">${extraEntries.map(e => {
            const u = userMeta(e.username);
            const extra = e.type ? ` · ${e.type}` : '';
            return `<div class="week-extra-pill"><span class="dot" style="background:${u.color}"></span><span class="tag">${SLOT_LABEL[e.slot]}</span> ${u.display_name}${extra}</div>`;
          }).join('')}</div>`
        : '';

      const div = document.createElement('div');
      div.className = 'week-day' + (isToday ? ' today' : '');
      div.innerHTML = `
        <div class="week-day-header">
          <div class="week-date-badge">
            <span class="badge-dow">${DOW_SHORT[d.getDay()]}</span>
            <span class="badge-num">${d.getDate()}</span>
          </div>
          <div>
            <div class="dow">${DOW_FULL[d.getDay()]}</div>
            <div class="datestr">${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}</div>
          </div>
        </div>
        <div class="week-slots">
          <div class="week-slot">
            <div class="week-slot-label">Pagi</div>
            ${pagiHtml}
          </div>
          <div class="week-slot">
            <div class="week-slot-label">Siang</div>
            ${siangHtml}
          </div>
        </div>
        ${extraHtml}
      `;
      div.addEventListener('click', () => openModal(dateStr));
      weekList.appendChild(div);
    }
  }

  // ============================================================
  // MONTHLY RENDER
  // ============================================================
  async function renderMonthly(){
    const start = new Date(viewYear, viewMonth, 1);
    const end = new Date(viewYear, viewMonth + 1, 0);
    await loadEntriesRange(fmtDate(start), fmtDate(end));

    navLabel.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
    grid.innerHTML = '';

    const firstDay = start.getDay();
    const daysInMonth = end.getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

    const cells = [];
    for (let i = firstDay - 1; i >= 0; i--) cells.push({ day: daysInPrevMonth - i, other:true });
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, other:false });
    while (cells.length % 7 !== 0) cells.push({ day: cells.length, other:true });

    cells.forEach(cell => {
      const div = document.createElement('div');
      div.className = 'day' + (cell.other ? ' other' : '');
      let dateStr = null;
      if (!cell.other) {
        const d = new Date(viewYear, viewMonth, cell.day);
        dateStr = fmtDate(d);
        if (isSameDay(d, today)) div.classList.add('today');
      }

      let dotsHtml = '';
      if (dateStr && entriesByDate[dateStr]) {
        dotsHtml = '<div class="dots-row">' + entriesByDate[dateStr].slice(0,6).map(e => {
          const u = userMeta(e.username);
          return `<span class="mini-dot" style="background:${u.color}"></span>`;
        }).join('') + '</div>';
      }

      div.innerHTML = `<div class="num">${cell.day}</div>${dotsHtml}`;
      if (!cell.other) div.addEventListener('click', () => openModal(dateStr));
      grid.appendChild(div);
    });
  }

  async function render(){
    if (viewMode === 'weekly') {
      weekList.style.display = 'flex';
      monthCalendar.style.display = 'none';
      viewTitle.textContent = 'Weekly Schedule';
      await renderWeekly();
    } else {
      weekList.style.display = 'none';
      monthCalendar.style.display = 'block';
      viewTitle.textContent = 'Monthly Schedule';
      await renderMonthly();
    }
  }

  document.getElementById('weeklyBtn').addEventListener('click', () => {
    viewMode = 'weekly';
    document.getElementById('weeklyBtn').classList.add('active');
    document.getElementById('monthlyBtn').classList.remove('active');
    render();
  });
  document.getElementById('monthlyBtn').addEventListener('click', () => {
    viewMode = 'monthly';
    document.getElementById('monthlyBtn').classList.add('active');
    document.getElementById('weeklyBtn').classList.remove('active');
    render();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (viewMode === 'weekly') { weekAnchor.setDate(weekAnchor.getDate() - 7); }
    else { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } }
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (viewMode === 'weekly') { weekAnchor.setDate(weekAnchor.getDate() + 7); }
    else { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } }
    render();
  });

  // ============================================================
  // Slot type picker
  // ============================================================
  slotGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-slot]');
    if (!btn || btn.disabled) return;
    slotGrid.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('entrySlot').value = btn.dataset.slot;
  });

  // ============================================================
  // Block-all-team toggle
  // ============================================================
  function updateBlockAllUI(){
    const blockAll = document.getElementById('blockAllToggle').checked;
    const cutiBtn = slotGrid.querySelector('button[data-slot="cuti"]');
    const izinBtn = slotGrid.querySelector('button[data-slot="izin"]');
    if (blockAll) {
      userField.style.display = 'none';
      cutiBtn.disabled = true;
      izinBtn.disabled = true;
      const current = document.getElementById('entrySlot').value;
      if (current === 'cuti' || current === 'izin') {
        slotGrid.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        slotGrid.querySelector('button[data-slot="pagi"]').classList.add('active');
        document.getElementById('entrySlot').value = 'pagi';
      }
    } else {
      userField.style.display = '';
      cutiBtn.disabled = false;
      izinBtn.disabled = false;
    }
  }
  document.getElementById('blockAllToggle').addEventListener('change', updateBlockAllUI);

  // ============================================================
  // Modal: add / view / edit entries
  // ============================================================
  function openModal(dateStr){
    selectedDate = dateStr;
    const d = new Date(dateStr + 'T00:00:00');
    modalTitle.textContent = `${DOW_FULL[d.getDay()]}, ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
    modalSub.textContent = 'Ajukan cuti, visit, atau izin untuk tanggal ini.';

    entryForm.reset();
    document.getElementById('entryDate').value = dateStr;
    slotGrid.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    slotGrid.querySelector('button[data-slot="pagi"]').classList.add('active');
    document.getElementById('entrySlot').value = 'pagi';
    if (!currentUser.is_admin) entryUserSel.value = currentUser.username;
    stopEdit();

    const blockAllToggle = document.getElementById('blockAllToggle');
    blockAllToggle.checked = false;
    updateBlockAllUI();

    const existing = entriesByDate[dateStr] || [];
    if (existing.length === 0) {
      existingList.innerHTML = `<div style="font-size:12.5px;color:var(--text-2);">Belum ada jadwal di tanggal ini.</div>`;
    } else {
      existingList.innerHTML = existing.map(e => {
        const u = userMeta(e.username);
        const canEdit = currentUser.is_admin || currentUser.username === e.username;
        const label = e.type ? `${SLOT_LABEL[e.slot]} · ${e.type}` : SLOT_LABEL[e.slot];
        const photo = TEAM_PHOTOS[e.username];
        const avatarHtml = photo
          ? `<span class="avatar" style="width:22px;height:22px;overflow:hidden;padding:0;"><img src="${photo.photo}" alt="${photo.name}" style="width:100%;height:100%;object-fit:cover;object-position:center 15%;"></span>`
          : `<span class="avatar" style="width:22px;height:22px;background:${u.color};font-size:9px;">${u.initial}</span>`;
        return `
          <div class="existing-item">
            ${avatarHtml}
            <span class="who">${u.display_name} — ${label}</span>
            ${canEdit ? `
              <button data-id="${e.id}" class="editEntry" title="Edit">✏️</button>
              <button data-id="${e.id}" class="delEntry" title="Hapus">🗑️</button>
            ` : ''}
          </div>`;
      }).join('');
      existingList.querySelectorAll('.delEntry').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          await sbClient.from('schedules').delete().eq('id', id);
          await render();
          openModal(dateStr);
        });
      });
      existingList.querySelectorAll('.editEntry').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const entry = existing.find(x => String(x.id) === String(id));
          if (entry) startEdit(entry);
        });
      });
    }

    overlay.style.display = 'flex';
  }

  function startEdit(entry){
    editingEntryId = entry.id;
    document.getElementById('blockAllToggle').checked = false;
    document.getElementById('blockAllToggle').disabled = true;
    updateBlockAllUI();

    entryUserSel.value = entry.username;
    slotGrid.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    slotGrid.querySelector(`button[data-slot="${entry.slot}"]`).classList.add('active');
    document.getElementById('entrySlot').value = entry.slot;
    document.getElementById('entryType').value = entry.type || '';
    document.getElementById('entryDesc').value = entry.description || '';

    entryForm.querySelector('.btn-save').textContent = 'Update';
    modalSub.textContent = 'Mengedit jadwal yang sudah ada.';
  }
  function stopEdit(){
    editingEntryId = null;
    document.getElementById('blockAllToggle').disabled = false;
    entryForm.querySelector('.btn-save').textContent = 'Simpan';
  }

  function closeModal(){ overlay.style.display = 'none'; selectedDate = null; stopEdit(); }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  document.getElementById('openRequestBtn').addEventListener('click', () => {
    openModal(fmtDate(today));
  });

  entryForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const blockAll = document.getElementById('blockAllToggle').checked;
    const slot = document.getElementById('entrySlot').value;
    const date = document.getElementById('entryDate').value;
    const type = document.getElementById('entryType').value.trim();
    const description = document.getElementById('entryDesc').value.trim();

    if (editingEntryId) {
      const username = entryUserSel.value;
      const { error } = await sbClient.from('schedules').update({
        username, date, slot, type: type || null, description: description || null
      }).eq('id', editingEntryId);
      if (error) { alert('Gagal update: ' + error.message); return; }
    } else if (blockAll) {
      const rows = allUsers.map(u => ({
        username: u.username, date, slot, type: type || 'Meeting tim', description: description || null
      }));
      const { error } = await sbClient.from('schedules').insert(rows);
      if (error) { alert('Gagal menyimpan: ' + error.message); return; }
    } else {
      const username = entryUserSel.value;
      const { error } = await sbClient.from('schedules').insert({
        username, date, slot, type: type || null, description: description || null
      });
      if (error) { alert('Gagal menyimpan: ' + error.message); return; }
    }

    await render();
    openModal(date);
    entryForm.reset();
    document.getElementById('entryDate').value = date;
    if (!currentUser.is_admin) entryUserSel.value = currentUser.username;
    document.getElementById('blockAllToggle').checked = false;
    stopEdit();
    updateBlockAllUI();
  });

  // ============================================================
  // Admin: Reset Password
  // ============================================================
  const resetPwBtn = document.getElementById('resetPwBtn');
  const resetOverlay = document.getElementById('resetOverlay');
  const resetForm = document.getElementById('resetForm');
  const resetError = document.getElementById('resetError');
  const resetSuccess = document.getElementById('resetSuccess');

  if (currentUser.is_admin) resetPwBtn.style.display = 'flex';

  function openResetModal(){
    resetForm.reset();
    resetError.style.display = 'none';
    resetSuccess.style.display = 'none';
    resetOverlay.style.display = 'flex';
  }
  function closeResetModal(){ resetOverlay.style.display = 'none'; }

  resetPwBtn.addEventListener('click', openResetModal);
  document.getElementById('resetModalClose').addEventListener('click', closeResetModal);
  document.getElementById('resetCancelBtn').addEventListener('click', closeResetModal);
  resetOverlay.addEventListener('click', (e) => { if (e.target === resetOverlay) closeResetModal(); });

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    resetError.style.display = 'none';
    resetSuccess.style.display = 'none';
    const targetUser = document.getElementById('resetUser').value;
    const newPassword = document.getElementById('resetNewPw').value.trim();
    if (!newPassword) return;

    const { error } = await sbClient.from('users').update({ password: newPassword }).eq('username', targetUser);
    if (error) {
      resetError.textContent = 'Gagal update password: ' + error.message;
      resetError.style.display = 'block';
      return;
    }
    resetSuccess.textContent = `Password sementara untuk ${targetUser} berhasil diganti.`;
    resetSuccess.style.display = 'block';
    document.getElementById('resetNewPw').value = '';
  });

  // ============================================================
  // Export to printable report
  // ============================================================
  const exportOverlay = document.getElementById('exportOverlay');
  const exportForm = document.getElementById('exportForm');
  const exportError = document.getElementById('exportError');

  document.getElementById('exportBtn').addEventListener('click', () => {
    exportError.style.display = 'none';
    const startInput = document.getElementById('exportStart');
    const endInput = document.getElementById('exportEnd');
    if (!startInput.value) startInput.value = fmtDate(weekAnchor);
    if (!endInput.value) {
      const endDefault = new Date(weekAnchor); endDefault.setDate(endDefault.getDate() + 4);
      endInput.value = fmtDate(endDefault);
    }
    exportOverlay.style.display = 'flex';
  });
  document.getElementById('exportModalClose').addEventListener('click', () => exportOverlay.style.display = 'none');
  document.getElementById('exportCancelBtn').addEventListener('click', () => exportOverlay.style.display = 'none');
  exportOverlay.addEventListener('click', (e) => { if (e.target === exportOverlay) exportOverlay.style.display = 'none'; });

  exportForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    exportError.style.display = 'none';
    const startStr = document.getElementById('exportStart').value;
    const endStr = document.getElementById('exportEnd').value;
    if (!startStr || !endStr || startStr > endStr) {
      exportError.textContent = 'Rentang tanggal tidak valid.';
      exportError.style.display = 'block';
      return;
    }

    let rows = [];
    try {
      const { data, error } = await sbClient
        .from('schedules')
        .select('id, username, date, slot, type, description')
        .gte('date', startStr)
        .lte('date', endStr);
      if (error) throw error;
      rows = data || [];
    } catch (err) {
      exportError.textContent = 'Gagal mengambil data: ' + (err.message || err);
      exportError.style.display = 'block';
      return;
    }

    generateReport(startStr, endStr, rows);
    exportOverlay.style.display = 'none';
  });

  function generateReport(startStr, endStr, rows){
    const byDate = {};
    rows.forEach(r => {
      if (!byDate[r.date]) byDate[r.date] = [];
      byDate[r.date].push(r);
    });

    const start = new Date(startStr + 'T00:00:00');
    const end = new Date(endStr + 'T00:00:00');

    let daysHtml = '';
    let cursor = new Date(start);
    while (cursor <= end) {
      const dStr = fmtDate(cursor);
      const entries = byDate[dStr] || [];
      const rowsHtml = entries.length
        ? entries.map(e => {
            const u = userMeta(e.username);
            const label = e.type ? `${SLOT_LABEL[e.slot]} · ${e.type}` : SLOT_LABEL[e.slot];
            const note = e.description ? ` — ${e.description}` : '';
            return `<tr><td><span class="rp-dot" style="background:${u.color}"></span>${u.display_name}</td><td>${label}${note}</td></tr>`;
          }).join('')
        : `<tr><td colspan="2" class="rp-empty">Tidak ada jadwal</td></tr>`;

      daysHtml += `
        <div class="rp-day">
          <div class="rp-day-title">${DOW_FULL[cursor.getDay()]}, ${cursor.getDate()} ${MONTH_NAMES[cursor.getMonth()]} ${cursor.getFullYear()}</div>
          <table class="rp-table"><thead><tr><th>Nama</th><th>Keterangan</th></tr></thead><tbody>${rowsHtml}</tbody></table>
        </div>`;
      cursor.setDate(cursor.getDate() + 1);
    }

    const startLbl = `${start.getDate()} ${MONTH_NAMES[start.getMonth()]} ${start.getFullYear()}`;
    const endLbl = `${end.getDate()} ${MONTH_NAMES[end.getMonth()]} ${end.getFullYear()}`;

    const reportHtml = `<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><title>Laporan Jadwal Treasury EBB Sales</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;margin:0;padding:32px;background:#fff;}
  .rp-header{border-bottom:3px solid #790008;padding-bottom:16px;margin-bottom:24px;}
  .rp-header h1{font-size:20px;margin:0 0 4px;color:#790008;}
  .rp-header .rp-sub{font-size:13px;color:#555;}
  .rp-day{margin-bottom:20px;page-break-inside:avoid;}
  .rp-day-title{font-size:14px;font-weight:600;background:#f4e9e9;color:#790008;padding:8px 12px;border-radius:6px 6px 0 0;}
  .rp-table{width:100%;border-collapse:collapse;font-size:13px;}
  .rp-table th{text-align:left;background:#fafafa;padding:8px 12px;border-bottom:1px solid #ddd;font-size:11px;text-transform:uppercase;color:#777;}
  .rp-table td{padding:8px 12px;border-bottom:1px solid #eee;}
  .rp-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .rp-empty{color:#999;font-style:italic;}
  .rp-footer{margin-top:24px;font-size:11px;color:#999;text-align:center;}
  @media print{ body{padding:12px;} }
</style></head>
<body>
  <div class="rp-header"><h1>Laporan Jadwal — Treasury EBB Sales</h1><div class="rp-sub">Periode: ${startLbl} – ${endLbl}</div></div>
  ${daysHtml}
  <div class="rp-footer">Dibuat otomatis dari kevinjonathan.site — ${new Date().toLocaleString('id-ID')}</div>
  <script>window.onload = () => setTimeout(() => window.print(), 300);<\/script>
</body></html>`;

    const win = window.open('', '_blank');
    if (!win) { alert('Popup diblokir browser. Izinkan popup untuk export laporan.'); return; }
    win.document.open();
    win.document.write(reportHtml);
    win.document.close();
  }

  // ============================================================
  // Init
  // ============================================================
  (async function init(){
    try { await loadUsers(); } catch (err) { console.error('init loadUsers failed:', err); }
    try { await render(); } catch (err) { console.error('init render failed:', err); }
  })();
</script>
</body>
</html>
